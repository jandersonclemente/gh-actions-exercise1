name: "Lint, test, and deploy"
on: "push"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Link, test, deploy" 
        uses: actions/checkout@v3
      - name: "Install dependencies"
        run: npm ci
      - name: "Run Linter"
        run: npm run lint
      - name: "Run Tests"
        run: npm run test
      - name: "Build"
        run: npm run build
      - name: "Deploy"
        run : echo "Deploying to production..."