name: Event details
on:
    issues:
        types: [opened]
jobs:
    event-details:
        runs-on: ubunto-latest
        steps:
            - name: "Output event details"
              run: |
                  echo "Event name: ${{ github.event_name }}"
                  echo "Event action: ${{ github.event.action }}"
                  echo "Issue title: ${{ github.event.issue.title }}"
                  echo "Issue body: ${{ github.event.issue.body }}"