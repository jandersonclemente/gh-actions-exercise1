name: "Lint, test, and deploy"
on: "push"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout" 
        uses: actions/checkout@v3
      - name: "Install dependencies"
        run: npm ci
      - name: "Run Linter"
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Install dependencies"
        run: npm ci
      - name: "Run Tests"
        run: npm run test
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Install dependencies"
        run: npm ci
      - name: "Deploy"
        run: npm run build
      - name: "Deploy"
        run : echo "Deploying to production..."